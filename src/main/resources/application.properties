# ─── App ───────────────────────────────────────────
spring.application.name=mind-companion
server.port=8080

# ─── MySQL ─────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/mind_companion_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=mindapp
spring.datasource.password=MindApp@2024
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ─── JPA ───────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ─── Thymeleaf ─────────────────────────────────────
spring.thymeleaf.cache=false

# ─── JWT ───────────────────────────────────────────
app.jwt.secret=ThisIsAVeryLongSecretKeyForJWTThatIsAtLeast256BitsLongForSecurity!
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ─── OpenAI ────────────────────────────────────────
openai.api.key=your-openai-key-here
openai.model=gpt-4o
openai.max-tokens=1000

# ─── Mail (Gmail SMTP) ─────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ─── Encryption ────────────────────────────────────
app.encryption.secret=MySecretEncryptionKey123!@#

# ─── Auto-delete policy ────────────────────────────
app.chat.auto-delete-days=365

# ─── File upload ───────────────────────────────────
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# ─── Logging ───────────────────────────────────────
logging.level.com.mindcompanion=DEBUG
logging.level.org.springframework.security=WARN