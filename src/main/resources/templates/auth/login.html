<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#6c63ff"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Mind Companion"/>
    <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
    <title>Login — Mind Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { color: #e94560; font-size: 1.8rem; font-weight: 700; }
        .brand span { color: #1a1a2e; }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e9ecef;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .btn-login {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px;
            padding: 12px; font-weight: 600;
            font-size: 1rem; color: #fff; width: 100%;
            transition: all 0.3s;
        }
        .btn-login:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(233,69,96,0.4); }
        .divider { text-align: center; color: #adb5bd; margin: 20px 0; font-size: 0.85rem; }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef; }
    </style>
</head>
<!-- Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW failed:', err));
        });
    }
</script>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand">Mind <span>Companion</span></div>
        <p class="text-muted mt-2 mb-0" style="font-size:0.9rem">Your AI mental wellness companion 💙</p>
    </div>

    <!-- Error message -->
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle me-2"></i>
        <span th:text="${error}">Invalid credentials</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Success message -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle me-2"></i>
        <span th:text="${success}">Success</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form id="loginForm">
        <div class="mb-3">
            <label class="form-label fw-500" style="font-size:0.9rem">Username or Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username"
                       placeholder="Enter username or email" required/>
            </div>
        </div>
        <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
                <label class="form-label fw-500 mb-0" style="font-size:0.9rem">Password</label>
                <a href="/forgot-password" class="text-decoration-none" style="font-size:0.8rem;color:#e94560;">Forgot password?</a>
            </div>
            <div class="input-group mt-1">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password"
                       placeholder="Enter your password" required/>
            </div>
        </div>
        <button type="submit" class="btn-login">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>
    </form>

    <div class="divider">— or —</div>
    <div class="text-center">
        <span class="text-muted" style="font-size:0.9rem">Don't have an account? </span>
        <a th:href="@{/register}" class="text-decoration-none fw-600" style="color:#e94560">Sign Up</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('username', data.username);
                window.location.href = '/dashboard';
            } else {
                showError(data.message || 'Invalid username or password. Please try again.');
            }
        } catch (err) {
            showError('Connection error. Please try again.');
        }
    });

    function showError(msg) {
        const existing = document.querySelector('.alert');
        if (existing) existing.remove();
        const alert = document.createElement('div');
        alert.className = 'alert alert-danger alert-dismissible fade show';
        alert.innerHTML = `<i class="bi bi-exclamation-triangle me-2"></i>${msg}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>`;
        document.getElementById('loginForm').insertAdjacentElement('beforebegin', alert);
    }
</script>
</body>
</html>
