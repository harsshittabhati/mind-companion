<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#6c63ff"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Mind Companion"/>
    <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
    <title>Register — Mind Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px 0;
        }
        .auth-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { color: #e94560; font-size: 1.8rem; font-weight: 700; }
        .brand span { color: #1a1a2e; }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e9ecef;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .btn-register {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px;
            padding: 12px; font-weight: 600;
            font-size: 1rem; color: #fff; width: 100%;
            transition: all 0.3s;
        }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(233,69,96,0.4); }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef; }
        .divider { text-align: center; color: #adb5bd; margin: 20px 0; font-size: 0.85rem; }
        .req-item { padding: 3px 0; color: #adb5bd; transition: color 0.2s; }
        .req-item.met { color: #28a745; }
        .req-item.met::first-letter { content: '✓'; }
    </style>
</head>
<!-- Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW failed:', err));
        });
    }
</script>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand">Mind <span>Companion</span></div>
        <p class="text-muted mt-2 mb-0" style="font-size:0.9rem">Create your wellness account 💚</p>
    </div>

    <div id="alertContainer"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                <input type="text" class="form-control" id="fullName"
                       placeholder="Your full name" required/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username"
                       placeholder="Choose a username" required/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email"
                       placeholder="your@email.com" required/>
            </div>
        </div>
        <div class="mb-3" style="position:relative;">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password"
                       placeholder="Enter password" required minlength="8"/>
            </div>
            <div class="mt-2">
                <div style="height:4px;background:#e9ecef;border-radius:2px;overflow:hidden;">
                    <div id="strengthBar" style="height:100%;width:0%;transition:all 0.3s;border-radius:2px;"></div>
                </div>
                <small id="strengthText" style="font-size:0.75rem;font-weight:500;"></small>
            </div>
            <!-- Password requirements cloud -->
            <div id="pwRequirements" style="
                display:none; position:fixed; z-index:9999;
                background:#1a1a2e; color:#fff; border-radius:10px;
                padding:10px 14px; font-size:0.75rem;
                box-shadow:0 8px 24px rgba(0,0,0,0.3); width:220px;
                border: 1px solid rgba(255,255,255,0.1);">
                <div style="font-weight:600;margin-bottom:6px;color:#e94560;font-size:0.78rem;">Password must have:</div>
                <div id="req-length"  class="req-item">✗ At least 8 characters</div>
                <div id="req-upper"   class="req-item">✗ One uppercase letter</div>
                <div id="req-lower"   class="req-item">✗ One lowercase letter</div>
                <div id="req-number"  class="req-item">✗ One number</div>
                <div id="req-special" class="req-item">✗ One special character</div>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="Repeat your password" required/>
            </div>
        </div>
        <button type="submit" class="btn-register">
            <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
    </form>

    <div class="divider">— or —</div>
    <div class="text-center">
        <span class="text-muted" style="font-size:0.9rem">Already have an account? </span>
        <a th:href="@{/login}" class="text-decoration-none fw-600" style="color:#e94560">Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    // ── Password strength checker ─────────────────────
    const pwField = document.getElementById('password');

    pwField.addEventListener('focus', function() {
        const rect = this.getBoundingClientRect();
        const popup = document.getElementById('pwRequirements');
        popup.style.display = 'block';
        popup.style.top = rect.top + 'px';
        popup.style.left = (rect.right + 10) + 'px';
    });

    pwField.addEventListener('blur', function() {
        document.getElementById('pwRequirements').style.display = 'none';
    });

    pwField.addEventListener('input', function() {
        const val = this.value;
        const strengthBar = document.getElementById('strengthBar');
        const strengthText = document.getElementById('strengthText');

        // Update requirement items
        const checks = {
            'req-length':  val.length >= 8,
            'req-upper':   /[A-Z]/.test(val),
            'req-lower':   /[a-z]/.test(val),
            'req-number':  /[0-9]/.test(val),
            'req-special': /[^A-Za-z0-9]/.test(val)
        };
        const labels = {
            'req-length':  ' At least 8 characters',
            'req-upper':   ' One uppercase letter (A-Z)',
            'req-lower':   ' One lowercase letter (a-z)',
            'req-number':  ' One number (0-9)',
            'req-special': ' One special character (!@#$%)'
        };

        let score = 0;
        for (const [id, met] of Object.entries(checks)) {
            const el = document.getElementById(id);
            if (met) {
                el.textContent = '✓' + labels[id];
                el.classList.add('met');
                score++;
            } else {
                el.textContent = '✗' + labels[id];
                el.classList.remove('met');
            }
        }

        const levels = [
            { label: '', color: '#e9ecef', width: '0%' },
            { label: 'Very Weak', color: '#dc3545', width: '20%' },
            { label: 'Weak', color: '#fd7e14', width: '40%' },
            { label: 'Fair', color: '#ffc107', width: '60%' },
            { label: 'Strong', color: '#28a745', width: '80%' },
            { label: 'Very Strong', color: '#20c997', width: '100%' }
        ];

        const lvl = levels[score];
        strengthBar.style.width = lvl.width;
        strengthBar.style.background = lvl.color;
        strengthText.textContent = lvl.label;
        strengthText.style.color = lvl.color;
    });

    function validatePassword(password) {
        const errors = [];
        if (password.length < 8) errors.push('at least 8 characters');
        if (!/[A-Z]/.test(password)) errors.push('one uppercase letter');
        if (!/[a-z]/.test(password)) errors.push('one lowercase letter');
        if (!/[0-9]/.test(password)) errors.push('one number');
        if (!/[^A-Za-z0-9]/.test(password)) errors.push('one special character (!@#$%^&*)');
        return errors;
    }

    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const username = document.getElementById('username').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        // Password policy
        const pwErrors = validatePassword(password);
        if (pwErrors.length > 0) {
            showAlert('Password must contain: ' + pwErrors.join(', ') + '.', 'danger');
            return;
        }

        if (password !== confirmPassword) {
            showAlert('Passwords do not match.', 'danger');
            return;
        }

        const btn = document.querySelector('.btn-register');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Creating account...';

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                document.getElementById('registerForm').style.display = 'none';
                document.getElementById('alertContainer').innerHTML = `
                    <div class="text-center py-3">
                        <div style="font-size:3rem">📧</div>
                        <h5 class="fw-bold mt-3" style="color:#1a1a2e">Check your email!</h5>
                        <p class="text-muted" style="font-size:0.9rem">
                            We sent a verification link to <strong>${email}</strong>.<br>
                            Click the link in the email to activate your account.
                        </p>
                        <a href="/login" class="btn-register mt-3 d-inline-block text-center text-decoration-none"
                           style="padding:10px 30px;border-radius:10px;">
                            Back to Login
                        </a>
                    </div>`;
            } else {
                showAlert(data.message || 'Registration failed. Please try again.', 'danger');
                btn.disabled = false;
                btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
            }
        } catch (err) {
            showAlert('Connection error. Please try again.', 'danger');
            btn.disabled = false;
            btn.innerHTML = '<i class="bi bi-person-plus me-2"></i>Create Account';
        }
    });

    function showAlert(msg, type) {
        document.getElementById('alertContainer').innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
            ${msg}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }
</script>
</body>
</html>
