<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <!-- PWA -->
    <link rel="manifest" href="/manifest.json"/>
    <meta name="theme-color" content="#6c63ff"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-title" content="Mind Companion"/>
    <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
    <title>Register — Mind Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
            padding: 20px 0;
        }
        .auth-card {
            background: #fff;
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 460px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { color: #e94560; font-size: 1.8rem; font-weight: 700; }
        .brand span { color: #1a1a2e; }
        .form-control {
            border-radius: 10px;
            padding: 12px 16px;
            border: 1.5px solid #e9ecef;
            font-size: 0.9rem;
        }
        .form-control:focus {
            border-color: #e94560;
            box-shadow: 0 0 0 3px rgba(233,69,96,0.1);
        }
        .btn-register {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px;
            padding: 12px; font-weight: 600;
            font-size: 1rem; color: #fff; width: 100%;
            transition: all 0.3s;
        }
        .btn-register:hover { transform: translateY(-1px); box-shadow: 0 5px 15px rgba(233,69,96,0.4); }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef; }
        .divider { text-align: center; color: #adb5bd; margin: 20px 0; font-size: 0.85rem; }
    </style>
</head>
<!-- Service Worker -->
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('/service-worker.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.log('SW failed:', err));
        });
    }
</script>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand">Mind <span>Companion</span></div>
        <p class="text-muted mt-2 mb-0" style="font-size:0.9rem">Create your wellness account 💚</p>
    </div>

    <div id="alertContainer"></div>

    <form id="registerForm">
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Full Name</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person-badge"></i></span>
                <input type="text" class="form-control" id="fullName"
                       placeholder="Your full name" required/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Username</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" id="username"
                       placeholder="Choose a username" required/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Email</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email"
                       placeholder="your@email.com" required/>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password"
                       placeholder="Min 6 characters" required minlength="6"/>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="Repeat your password" required/>
            </div>
        </div>
        <button type="submit" class="btn-register">
            <i class="bi bi-person-plus me-2"></i>Create Account
        </button>
    </form>

    <div class="divider">— or —</div>
    <div class="text-center">
        <span class="text-muted" style="font-size:0.9rem">Already have an account? </span>
        <a th:href="@{/login}" class="text-decoration-none fw-600" style="color:#e94560">Sign In</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value;
        const username = document.getElementById('username').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showAlert('Passwords do not match.', 'danger');
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullName, username, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                showAlert('Account created! Redirecting to login...', 'success');
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                showAlert(data.message || 'Registration failed. Please try again.', 'danger');
            }
        } catch (err) {
            showAlert('Connection error. Please try again.', 'danger');
        }
    });

    function showAlert(msg, type) {
        document.getElementById('alertContainer').innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show" role="alert">
            <i class="bi bi-${type === 'success' ? 'check-circle' : 'exclamation-triangle'} me-2"></i>
            ${msg}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>`;
    }
</script>
</body>
</html>
