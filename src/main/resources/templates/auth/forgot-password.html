<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Forgot Password — Mind Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #fff; border-radius: 24px; padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { color: #e94560; font-size: 1.8rem; font-weight: 700; }
        .brand span { color: #1a1a2e; }
        .form-control {
            border-radius: 10px; padding: 12px 16px;
            border: 1.5px solid #e9ecef; font-size: 0.9rem;
        }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.1); }
        .btn-submit {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px; padding: 12px;
            font-weight: 600; font-size: 1rem; color: #fff; width: 100%;
        }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand">Mind <span>Companion</span></div>
        <p class="text-muted mt-2 mb-0" style="font-size:0.9rem">Reset your password 🔐</p>
    </div>

    <div id="alertContainer"></div>
    <div id="formSection">
        <p class="text-muted mb-4" style="font-size:0.88rem">
            Enter your email and we'll send you a link to reset your password.
        </p>
        <div class="mb-4">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Email Address</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" placeholder="your@email.com" required/>
            </div>
        </div>
        <button class="btn-submit" onclick="submitForgot()">
            <i class="bi bi-send me-2"></i>Send Reset Link
        </button>
    </div>

    <div class="text-center mt-4" id="backLink">
        <a href="/login" class="text-decoration-none" style="font-size:0.9rem;color:#e94560;">
            <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    async function submitForgot() {
        const email = document.getElementById('email').value.trim();
        if (!email) return;

        const btn = document.querySelector('.btn-submit');
        btn.disabled = true;
        btn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>Sending...';

        try {
            const res = await fetch('/api/auth/forgot-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            document.getElementById('formSection').style.display = 'none';
            document.getElementById('backLink').style.display = 'none';
            document.getElementById('alertContainer').innerHTML = `
                <div class="text-center py-3">
                    <div style="font-size:3rem">📧</div>
                    <h5 class="fw-bold mt-3" style="color:#1a1a2e">Check your email</h5>
                    <p class="text-muted" style="font-size:0.9rem">${data.message}</p>
                    <a href="/login" style="color:#e94560;font-size:0.9rem;text-decoration:none;">
                        <i class="bi bi-arrow-left me-1"></i>Back to Login
                    </a>
                </div>`;
        } catch (err) {
            document.getElementById('alertContainer').innerHTML =
                '<div class="alert alert-danger">Connection error. Please try again.</div>';
        }
    }
</script>
</body>
</html>
