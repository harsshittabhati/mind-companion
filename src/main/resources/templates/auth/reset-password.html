<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Reset Password — Mind Companion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
    <style>
        * { font-family: 'Inter', sans-serif; }
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex; align-items: center; justify-content: center;
        }
        .auth-card {
            background: #fff; border-radius: 24px; padding: 40px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .brand { color: #e94560; font-size: 1.8rem; font-weight: 700; }
        .brand span { color: #1a1a2e; }
        .form-control {
            border-radius: 10px; padding: 12px 16px;
            border: 1.5px solid #e9ecef; font-size: 0.9rem;
        }
        .form-control:focus { border-color: #e94560; box-shadow: 0 0 0 3px rgba(233,69,96,0.1); }
        .btn-submit {
            background: linear-gradient(135deg, #e94560, #c62a47);
            border: none; border-radius: 10px; padding: 12px;
            font-weight: 600; font-size: 1rem; color: #fff; width: 100%;
        }
        .input-group-text { background: #f8f9fa; border-radius: 10px 0 0 10px; border: 1.5px solid #e9ecef; }
    </style>
</head>
<body>
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand">Mind <span>Companion</span></div>
        <p class="text-muted mt-2 mb-0" style="font-size:0.9rem">Set a new password 🔑</p>
    </div>

    <div id="alertContainer"></div>
    <div id="formSection">
        <div class="mb-3">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">New Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" placeholder="Enter new password" required/>
            </div>
            <div class="mt-2">
                <div style="height:4px;background:#e9ecef;border-radius:2px;overflow:hidden;">
                    <div id="strengthBar" style="height:100%;width:0%;transition:all 0.3s;border-radius:2px;"></div>
                </div>
                <small id="strengthText" style="font-size:0.75rem;font-weight:500;"></small>
            </div>
        </div>
        <div class="mb-4">
            <label class="form-label" style="font-size:0.9rem;font-weight:500">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock-fill"></i></span>
                <input type="password" class="form-control" id="confirmPassword" placeholder="Repeat new password" required/>
            </div>
        </div>
        <button class="btn-submit" onclick="submitReset()">
            <i class="bi bi-check-circle me-2"></i>Reset Password
        </button>
    </div>

    <div class="text-center mt-4">
        <a href="/login" class="text-decoration-none" style="font-size:0.9rem;color:#e94560;">
            <i class="bi bi-arrow-left me-1"></i>Back to Login
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    const token = /*[[${token}]]*/ '';

    document.getElementById('password').addEventListener('input', function() {
        const val = this.value;
        let score = 0;
        if (val.length >= 8) score++;
        if (/[A-Z]/.test(val)) score++;
        if (/[a-z]/.test(val)) score++;
        if (/[0-9]/.test(val)) score++;
        if (/[^A-Za-z0-9]/.test(val)) score++;
        const levels = [
            { label: '', color: '#e9ecef', width: '0%' },
            { label: 'Very Weak', color: '#dc3545', width: '20%' },
            { label: 'Weak', color: '#fd7e14', width: '40%' },
            { label: 'Fair', color: '#ffc107', width: '60%' },
            { label: 'Strong', color: '#28a745', width: '80%' },
            { label: 'Very Strong', color: '#20c997', width: '100%' }
        ];
        const lvl = levels[score];
        document.getElementById('strengthBar').style.width = lvl.width;
        document.getElementById('strengthBar').style.background = lvl.color;
        document.getElementById('strengthText').textContent = lvl.label;
        document.getElementById('strengthText').style.color = lvl.color;
    });

    async function submitReset() {
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;

        if (password !== confirmPassword) {
            showAlert('Passwords do not match.', 'danger'); return;
        }
        if (password.length < 8) {
            showAlert('Password must be at least 8 characters.', 'danger'); return;
        }

        try {
            const res = await fetch('/api/auth/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, password })
            });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('formSection').style.display = 'none';
                document.getElementById('alertContainer').innerHTML = `
                    <div class="text-center py-3">
                        <div style="font-size:3rem">✅</div>
                        <h5 class="fw-bold mt-3" style="color:#1a1a2e">Password Reset!</h5>
                        <p class="text-muted" style="font-size:0.9rem">${data.message}</p>
                        <a href="/login" class="btn-submit d-inline-block mt-2 text-decoration-none"
                           style="padding:10px 30px;border-radius:10px;">Go to Login</a>
                    </div>`;
            } else {
                showAlert(data.message || 'Failed to reset password.', 'danger');
            }
        } catch (err) {
            showAlert('Connection error. Please try again.', 'danger');
        }
    }

    function showAlert(msg, type) {
        document.getElementById('alertContainer').innerHTML = `
            <div class="alert alert-${type} alert-dismissible fade show">
                ${msg}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>`;
    }
</script>
</body>
</html>
